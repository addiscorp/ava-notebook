# Check, test and build Notebook on every PR and on main.
#
# Runners: this repo is public, so CI runs on GitHub-hosted runners, as
# public repos may (APS 11, as Sami amended it on 10-12 Nov). Private repos
# run on our own runners. This repo has no publish
# job: avacanada/ava-catalogue builds Notebook from a pinned commit, signs it
# and publishes it (see README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # No install scripts: nothing in the tree needs one, and the catalogue
      # builds this the same way.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      # After the build: test/bundle.test.ts checks the bundle itself.
      - run: npm test
